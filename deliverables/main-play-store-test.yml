name: Build Aya Android — Google Play (separate)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout this repository first so the original signing secrets remain available.
      - name: Checkout signing repository
        uses: actions/checkout@v4

      # The app's web files come from the experimental repository.
      - name: Checkout experimental app source
        uses: actions/checkout@v4
        with:
          repository: ahmedmilla0006-hash/test-index210-split.
          ref: main
          path: app-source

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create Android project
        run: |
          mkdir -p android-app
          cd android-app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare web files
        run: |
          mkdir -p android-app/www
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android-app' \
            app-source/ android-app/www/

      - name: Initialize Capacitor
        working-directory: android-app
        run: npx cap init "آية" "com.aya.alquran" --web-dir www

      - name: Add Android platform
        working-directory: android-app
        run: npx cap add android

      - name: Set separate experimental application ID
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          gradle = Path("android-app/android/app/build.gradle")
          if not gradle.exists():
              gradle = Path("android-app/android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("ERROR: Android app Gradle file not found")

          text = gradle.read_text(encoding="utf-8")
          pattern = r"(applicationId\s+)(['\"])(com\.aya\.alquran)(['\"])"
          updated, count = re.subn(pattern, r"\1\2com.aya.alquran.test\4", text, count=1)
          if count != 1:
              raise SystemExit("ERROR: Could not safely set applicationId to com.aya.alquran.test")
          gradle.write_text(updated, encoding="utf-8")
          if "applicationId 'com.aya.alquran.test'" not in updated and 'applicationId "com.aya.alquran.test"' not in updated and 'applicationId("com.aya.alquran.test")' not in updated:
              raise SystemExit("ERROR: Experimental application ID verification failed")
          print("Experimental application ID configured: com.aya.alquran.test")
          PY

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow

      - name: Sync Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Set automatic Google Play version
        id: ver
        run: |
          CODE="$((203 + GITHUB_RUN_NUMBER))"
          NAME="1.0.${CODE}"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME" >> "$GITHUB_OUTPUT"

      # ============================================================
      # KEYSTORE
      # ============================================================

      - name: Decode and verify keystore
        env:
          K1: ${{ secrets.KS1 }}
          K2: ${{ secrets.KS2 }}
          K3: ${{ secrets.KS3 }}
          K4: ${{ secrets.KS4 }}
          K5: ${{ secrets.KS5 }}
          K6: ${{ secrets.KS6 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 << 'PY'
          import os, re, base64, pathlib, subprocess, sys

          parts = []
          for i in range(1, 7):
              v = os.environ.get(f"K{i}") or ""
              print(f"KS{i} length = {len(v)}")
              if not v:
                  print(f"::error::السر KS{i} ناقص")
                  sys.exit(1)
              parts.append(v)

          b64 = "".join(parts)
          # إزالة أي محارف غير Base64 (مسافات، أسطر، إلخ)
          b64 = re.sub(r"[^A-Za-z0-9+/=]", "", b64)
          # إكمال الحشو إن نقص
          pad = (-len(b64)) % 4
          if pad:
              b64 += "=" * pad

          print(f"Total base64 length = {len(b64)}")

          try:
              raw = base64.b64decode(b64, validate=False)
          except Exception as e:
              print(f"::error::فشل فك Base64: {e}")
              sys.exit(1)

          out = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "aya-release.jks"
          out.write_bytes(raw)
          print(f"Keystore bytes = {len(raw)}")
          if len(raw) < 100:
              print("::error::ملف keystore صغير جداً — الأجزاء ناقصة")
              sys.exit(1)

          pw = os.environ.get("KEYSTORE_PASSWORD") or ""
          alias = os.environ.get("KEY_ALIAS") or ""
          r = subprocess.run(
              ["keytool", "-list", "-keystore", str(out), "-storepass", pw, "-alias", alias],
              capture_output=True,
              text=True,
          )
          print(r.stdout)
          if r.returncode != 0:
              print(r.stderr)
              print("::error::keytool فشل — تحقق من KEYSTORE_PASSWORD و KEY_ALIAS")
              sys.exit(1)
          print("Keystore verified successfully.")
          PY

      # ============================================================
      # VERSION
      # ============================================================

      - name: Set version in Gradle
        env:
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
          VERSION_NAME: ${{ steps.ver.outputs.versionName }}
        run: |
          python3 << 'PY'
          from pathlib import Path
          import os
          import re

          vc = os.environ["VERSION_CODE"]
          vn = os.environ["VERSION_NAME"]

          gradle = Path(
              "android-app/android/app/build.gradle"
          )

          if not gradle.exists():
              gradle = Path(
                  "android-app/android/app/build.gradle.kts"
              )

          if not gradle.exists():
              raise SystemExit(
                  "ERROR: Gradle file not found."
              )

          text = gradle.read_text(
              encoding="utf-8"
          )

          text = re.sub(
              r"versionCode\s+\d+",
              "versionCode " + vc,
              text
          )

          text = re.sub(
              r'versionName\s+"[^"]*"',
              'versionName "' + vn + '"',
              text
          )

          gradle.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "version set",
              vc,
              vn
          )
          PY

      # ============================================================
      # NOTIFICATIONS — إشعار التلاوة (قائمة التشغيل)
      # ============================================================

      - name: Apply Android app integrations from experimental source
        run: |
          set -e
          python3 app-source/scripts/configure-android-app.py

      - name: Verify Android media service and private audio storage
        run: |
          set -e
          python3 <<'PY_CLEANUP'
          from pathlib import Path
          import re
          root = Path("android-app/android/app/src/main")
          java_dir = root / "java/com/aya/alquran"
          for name in ("UpdateCheckWorker.java", "UpdateInstallActivity.java", "UpdateDownloadReceiver.java"):
              p = java_dir / name
              if p.exists(): p.unlink()
          manifest = root / "AndroidManifest.xml"
          mt = manifest.read_text(encoding="utf-8")
          mt = re.sub(r'\s*<uses-permission\b(?=[^>]*android:name="android\.permission\.REQUEST_INSTALL_PACKAGES")[^>]*/>\s*', "\n", mt)
          for component in ("UpdateInstallActivity", "UpdateDownloadReceiver"):
              pattern = r'\s*<(?:activity|receiver)\b(?=[^>]*android:name="\.' + component + r'")[^>]*(?:/>|>.*?</(?:activity|receiver)>)\s*'
              mt = re.sub(pattern, "\n", mt, flags=re.DOTALL)
          mt = re.sub(r'\s*<provider\b(?=[^>]*android:name="androidx\.core\.content\.FileProvider")[^>]*>.*?</provider>\s*', "\n", mt, flags=re.DOTALL)
          manifest.write_text(mt, encoding="utf-8")
          file_paths = root / "res/xml/file_paths.xml"
          if file_paths.exists() and "fileprovider" not in mt.lower(): file_paths.unlink()
          PY_CLEANUP
          test -f android-app/android/app/src/main/java/com/aya/alquran/MainActivity.java
          test -f android-app/android/app/src/main/java/com/aya/alquran/AyaMediaService.java
          grep -q "public class AyaMediaService" android-app/android/app/src/main/java/com/aya/alquran/AyaMediaService.java
          grep -q "AyaPrivateAudioStoreJs" android-app/android/app/src/main/java/com/aya/alquran/MainActivity.java
          grep -q 'android:name=".AyaMediaService"' android-app/android/app/src/main/AndroidManifest.xml
          if grep -Rqs --include='AndroidManifest.xml' 'android.permission.REQUEST_INSTALL_PACKAGES' android-app/android/app/src/main; then
            echo "::error::APK installation permission remains"
            exit 1
          fi
          echo "Media service and private audio storage verified."

      # ============================================================
      # إزالة إذن الميكروفون من المانيفست فقط (بدون حظر صارم للكود)
      # ============================================================

      - name: Remove RECORD_AUDIO from manifest if present
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          import re

          root = Path("android-app/android/app/src/main")
          removed = 0
          for manifest in root.rglob("AndroidManifest.xml"):
              text = manifest.read_text(encoding="utf-8")
              new_text = re.sub(
                  r'\s*<uses-permission\s+android:name=["\']android\.permission\.RECORD_AUDIO["\']\s*/?>',
                  "",
                  text,
              )
              if new_text != text:
                  manifest.write_text(new_text, encoding="utf-8")
                  removed += 1
                  print("Removed RECORD_AUDIO from", manifest)
          if removed == 0:
              print("No RECORD_AUDIO permission in manifests (nothing to remove).")
          else:
              print("Stripped RECORD_AUDIO from", removed, "manifest file(s).")
          # لا نفشل البناء بسبب WebChromeClient أو كود عام — التطبيق لا يطلب الميكروفون
          print("Microphone permission will not appear; no hard code ban applied.")
          PY

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Ensure Manage Space in manifest (before APK build)
        run: |
          python3 -c "import base64; exec(base64.b64decode('').decode('utf-8'))"
          echo "---- Manifest manageSpace check ----"
          grep -n "manageSpaceActivity\|ManageSpaceActivity" android-app/android/app/src/main/AndroidManifest.xml || (echo "MISSING manageSpace" && exit 1)

      - name: Inject app version into all web assets
        env:
          VERSION_NAME: ${{ steps.ver.outputs.versionName }}
        run: |
          set -e
          python3 <<'PY_VERSION'
          from pathlib import Path
          import os

          version = os.environ["VERSION_NAME"]
          display_version = version + " – تجريبي"
          roots = [
              Path("android-app/www"),
              Path("android-app/android/app/src/main/assets/public"),
          ]
          text_suffixes = {".html", ".js", ".css", ".json", ".webmanifest", ".txt", ".xml"}
          changed = []
          unresolved = []

          for root in roots:
              if not root.exists():
                  raise SystemExit(f"ERROR: web assets directory not found: {root}")
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix.lower() not in text_suffixes:
                      continue
                  try:
                      content = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  if "__AYA_BUILD_VERSION__" in content:
                      path.write_text(content.replace("__AYA_BUILD_VERSION__", display_version), encoding="utf-8")
                      changed.append(str(path))

          # Verify every packaged web asset, not only index.html.
          packaged = roots[1]
          for path in packaged.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if "__AYA_BUILD_VERSION__" in content:
                  unresolved.append(str(path))

          if unresolved:
              raise SystemExit("ERROR: unresolved version placeholder in: " + ", ".join(unresolved))

          index = packaged / "index.html"
          if not index.exists() or display_version not in index.read_text(encoding="utf-8"):
              raise SystemExit("ERROR: experimental display version not found in packaged index.html")

          print(f"Injected display version {display_version}; changed files: {changed}")
          print("Verified no raw version placeholder remains in packaged web assets.")
          PY_VERSION
          if grep -q "update.json\|download-apk\|updatesOverlay" android-app/android/app/src/main/assets/public/index.html; then
            echo "::error::In-app updater residue remains in packaged web assets"
            exit 1
          fi
          echo "Verified: packaged assets have no in-app updater."

      - name: Set experimental Android display name after sync
        run: |
          python3 <<'PY_APP_NAME'
          from pathlib import Path
          import re

          res = Path("android-app/android/app/src/main/res")
          manifest = Path("android-app/android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("ERROR: AndroidManifest.xml not found")

          # Update app_name in every localized strings resource so a device
          # language cannot silently restore the original app name.
          found = 0
          for strings in res.glob("values*/strings.xml"):
              content = strings.read_text(encoding="utf-8")
              updated, count = re.subn(
                  r'(<string\s+name=["\'](?:app_name|title_activity_main)["\']\s*>).*?(</string>)',
                  r'\1آية تجريبي\2',
                  content,
                  flags=re.DOTALL,
              )
              if count:
                  strings.write_text(updated, encoding="utf-8")
                  found += count

          # Set the launcher label explicitly on the application element.
          xml = manifest.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(<application\b[^>]*\bandroid:label=)["\'][^"\']*["\']',
              r'\1"آية تجريبي"',
              xml,
              count=1,
          )
          if count == 0:
              updated, count = re.subn(
                  r'<application\b',
                  '<application android:label="آية تجريبي"',
                  xml,
                  count=1,
              )
          if count != 1:
              raise SystemExit("ERROR: Could not set Android application label")
          manifest.write_text(updated, encoding="utf-8")

          final_xml = manifest.read_text(encoding="utf-8")
          if 'android:label="آية تجريبي"' not in final_xml:
              raise SystemExit("ERROR: Launcher label verification failed")
          print(f"Verified launcher label: آية تجريبي; localized string entries updated: {found}")
          PY_APP_NAME

      - name: Build signed release APK
        working-directory: android-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          STORE="${{ github.workspace }}/aya-release.jks"

          if [ ! -f "$STORE" ]; then
            echo "::error::Keystore file not found."
            exit 1
          fi

          # بناء APK (تثبيت مباشر) + AAB (Google Play) معاً
          ./gradlew assembleRelease bundleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$STORE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi

          AAB=$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name "*.aab" | head -n 1)
          if [ -z "$AAB" ]; then
            echo "::error::Release AAB was not produced."
            exit 1
          fi

          # Give the downloadable APK a clear, user-friendly filename.
          APK_DIR=$(dirname "$APK")
          APK_NAMED="$APK_DIR/Aya-Test-${{ steps.ver.outputs.versionName }}.apk"
          cp "$APK" "$APK_NAMED"
          echo "APK: $APK_NAMED"
          echo "AAB: $AAB"

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt -o -name aapt2 | head -n 1)
          if [ -z "$AAPT" ]; then
            echo "::error::aapt/aapt2 not found; cannot verify final APK permissions."
            exit 1
          fi

          if "$AAPT" dump permissions "$APK" | grep -q "android.permission.RECORD_AUDIO"; then
            echo "::warning::APK still lists RECORD_AUDIO (may come from a dependency). App does not request mic at runtime."
          else
            echo "Final APK permission check: RECORD_AUDIO is not declared."
          fi
          echo "Both APK and AAB built successfully."

      # ============================================================
      # UPLOAD APK + AAB
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aya-play-store-apk-${{ steps.ver.outputs.versionName }}
          path: android-app/android/app/build/outputs/apk/release/Aya-Test-*.apk
          if-no-files-found: error

      - name: Upload AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: aya-play-store-aab-${{ steps.ver.outputs.versionName }}
          path: android-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
