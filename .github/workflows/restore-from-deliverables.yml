name: Restore main from deliverables backup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore exact ZIP contents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil, zipfile

          repo = Path.cwd()
          archive = repo / "deliverables" / "test-index210-split.-main.zip"
          if not archive.is_file():
              raise SystemExit("Backup ZIP not found at deliverables/test-index210-split.-main.zip")

          temp = repo.parent / "aya-restore-extracted"
          if temp.exists():
              shutil.rmtree(temp)
          temp.mkdir()

          with zipfile.ZipFile(archive) as z:
              names = [n for n in z.namelist() if not n.endswith("/")]
              roots = {Path(n).parts[0] for n in names}
              if roots != {"test-index210-split.-main"}:
                  raise SystemExit(f"Unexpected ZIP root(s): {roots}")
              for info in z.infolist():
                  p = Path(info.filename)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"Unsafe ZIP path: {info.filename}")
              z.extractall(temp)
              extracted = temp / "test-index210-split.-main"
              if not extracted.is_dir() or not (extracted / "index.html").is_file():
                  raise SystemExit("ZIP does not contain the expected project root/index.html")
              count = sum(1 for p in extracted.rglob("*") if p.is_file())
              if count != 71:
                  raise SystemExit(f"Expected 71 files in backup, found {count}")

          # Remove every repository item except Git metadata, then copy the
          # backup contents verbatim into the repository root.
          for item in repo.iterdir():
              if item.name == ".git":
                  continue
              if item.is_dir():
                  shutil.rmtree(item)
              else:
                  item.unlink()
          for item in extracted.iterdir():
              target = repo / item.name
              if item.is_dir():
                  shutil.copytree(item, target)
              else:
                  shutil.copy2(item, target)

          shutil.rmtree(temp)
          print(f"Restored {count} files from the ZIP into the repository root.")
          PY

      - name: Commit and push restored project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Restore main from deliverables backup"
          git push origin HEAD:main
