      - name: Remove RECORD_AUDIO from manifest if present
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          import re

          root = Path("android-app/android/app/src/main")
          removed = 0
          for manifest in root.rglob("AndroidManifest.xml"):
              text = manifest.read_text(encoding="utf-8")
              new_text = re.sub(
                  r'\s*<uses-permission\s+android:name=["\']android\.permission\.RECORD_AUDIO["\']\s*/?>',
                  "",
                  text,
              )
              if new_text != text:
                  manifest.write_text(new_text, encoding="utf-8")
                  removed += 1
                  print("Removed RECORD_AUDIO from", manifest)
          if removed == 0:
              print("No RECORD_AUDIO permission in manifests (nothing to remove).")
          else:
              print("Stripped RECORD_AUDIO from", removed, "manifest file(s).")
          # لا نفشل البناء بسبب WebChromeClient أو كود عام — التطبيق لا يطلب الميكروفون
          print("Microphone permission will not appear; no hard code ban applied.")
          PY

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Ensure Manage Space in manifest (before APK build)
        run: |
          python3 -c "import base64; exec(base64.b64decode('').decode('utf-8'))"
          echo "---- Manifest manageSpace check ----"
          grep -n "manageSpaceActivity\|ManageSpaceActivity" android-app/android/app/src/main/AndroidManifest.xml || (echo "MISSING manageSpace" && exit 1)

      - name: Build signed release APK
        working-directory: android-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          STORE="${{ github.workspace }}/aya-release.jks"

          if [ ! -f "$STORE" ]; then
            echo "::error::Keystore file not found."
            exit 1
          fi

          # بناء APK (تثبيت مباشر) + AAB (Google Play) معاً
          ./gradlew assembleRelease bundleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$STORE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi

          AAB=$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name "*.aab" | head -n 1)
          if [ -z "$AAB" ]; then
            echo "::error::Release AAB was not produced."
            exit 1
          fi

          echo "APK: $APK"
          echo "AAB: $AAB"

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt -o -name aapt2 | head -n 1)
          if [ -z "$AAPT" ]; then
            echo "::error::aapt/aapt2 not found; cannot verify final APK permissions."
            exit 1
          fi

          if "$AAPT" dump permissions "$APK" | grep -q "android.permission.RECORD_AUDIO"; then
            echo "::warning::APK still lists RECORD_AUDIO (may come from a dependency). App does not request mic at runtime."
          else
            echo "Final APK permission check: RECORD_AUDIO is not declared."
          fi
          echo "Both APK and AAB built successfully."

      # ============================================================
      # UPLOAD APK + AAB
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aya-android-apk-${{ steps.ver.outputs.versionName }}
          path: android-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: aya-android-aab-${{ steps.ver.outputs.versionName }}
          path: android-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
