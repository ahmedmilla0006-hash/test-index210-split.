          print("UpdateDownloadReceiver.java written.")

          UPDATE_INSTALL_ACTIVITY_CODE = __import__("base64").b64decode("").decode("utf-8")

          WORKER_CODE = 'package com.aya.alquran;\n\nimport android.app.NotificationChannel;\nimport android.app.NotificationManager;\nimport android.app.PendingIntent;\nimport android.content.Context;\nimport android.content.Intent;\nimport android.content.SharedPreferences;\nimport android.content.pm.PackageInfo;\nimport android.os.Build;\nimport android.graphics.Bitmap;\nimport android.graphics.BitmapFactory;\n\nimport androidx.annotation.NonNull;\nimport androidx.core.app.NotificationCompat;\nimport androidx.work.Worker;\nimport androidx.work.WorkerParameters;\n\nimport org.json.JSONObject;\n\nimport java.io.BufferedReader;\nimport java.io.InputStream;\nimport java.io.InputStreamReader;\nimport java.net.HttpURLConnection;\nimport java.net.URL;\n\npublic class UpdateCheckWorker extends Worker {\n    private static final String UPDATE_URL =\n            "https://raw.githubusercontent.com/ahmedmilla0006-hash/ayat-alquran-new/main/update.json";\n    private static final String CHANNEL_ID = "aya_updates";\n    private static final int NOTIFICATION_ID = 7703;\n    private static final String PREFS = "aya_background_updates";\n    private static final String LAST_NOTIFIED = "last_notified_version";\n\n    public UpdateCheckWorker(@NonNull Context context, @NonNull WorkerParameters params) {\n        super(context, params);\n    }\n\n    @NonNull\n    @Override\n    public Result doWork() {\n        HttpURLConnection connection = null;\n        try {\n            URL url = new URL(UPDATE_URL + "?t=" + System.currentTimeMillis());\n            connection = (HttpURLConnection) url.openConnection();\n            connection.setRequestMethod("GET");\n            connection.setConnectTimeout(15000);\n            connection.setReadTimeout(20000);\n            connection.setUseCaches(false);\n            connection.setRequestProperty("Cache-Control", "no-cache");\n            connection.setRequestProperty("User-Agent", "Aya-Android-UpdateChecker");\n\n            int code = connection.getResponseCode();\n            if (code == 408 || code == 429 || code == 500 || code == 502\n                    || code == 503 || code == 504) return Result.retry();\n            if (code != HttpURLConnection.HTTP_OK) return Result.success();\n\n            InputStream input = connection.getInputStream();\n            BufferedReader reader = new BufferedReader(new InputStreamReader(input, "UTF-8"));\n            StringBuilder jsonText = new StringBuilder();\n            String line;\n            while ((line = reader.readLine()) != null) jsonText.append(line);\n            reader.close();\n            input.close();\n\n            JSONObject data = new JSONObject(jsonText.toString());\n            String remoteVersion = data.optString("version", "").trim();\n            if (remoteVersion.length() == 0) return Result.success();\n\n            String installedVersion = getInstalledVersion();\n            if (!isNewer(remoteVersion, installedVersion)) return Result.success();\n\n            SharedPreferences prefs = getApplicationContext().getSharedPreferences(\n                    PREFS, Context.MODE_PRIVATE);\n            if (remoteVersion.equals(prefs.getString(LAST_NOTIFIED, ""))) return Result.success();\n\n            String title = data.optString("title", "آية — تحديث جديد");\n            String notes = data.optString("body",\n                    data.optString("message", "يتوفر إصدار جديد من تطبيق آية."));\n            String apkUrl = data.optString("url", "").trim();\n            if (apkUrl.length() == 0) apkUrl = data.optString("apkUrl", "").trim();\n            if (apkUrl.length() == 0) apkUrl = data.optString("download_url", "").trim();\n\n            showUpdateNotification(remoteVersion, title, notes, apkUrl);\n            prefs.edit().putString(LAST_NOTIFIED, remoteVersion).apply();\n            return Result.success();\n        } catch (Exception e) {\n            return Result.retry();\n        } finally {\n            if (connection != null) connection.disconnect();\n        }\n    }\n\n    private String getInstalledVersion() {\n        try {\n            PackageInfo info = getApplicationContext().getPackageManager().getPackageInfo(\n                    getApplicationContext().getPackageName(), 0);\n            return info.versionName == null ? "0" : info.versionName;\n        } catch (Exception e) {\n            return "0";\n        }\n    }\n\n    private boolean isNewer(String remote, String installed) {\n        try {\n            String[] r = remote.split("\\\\\\\\.");\n            String[] i = installed.split("\\\\\\\\.");\n            int count = Math.max(r.length, i.length);\n            for (int n = 0; n < count; n++) {\n                int rv = n < r.length ? parsePart(r[n]) : 0;\n                int iv = n < i.length ? parsePart(i[n]) : 0;\n                if (rv > iv) return true;\n                if (rv < iv) return false;\n            }\n            return false;\n        } catch (Exception e) {\n            return !remote.equals(installed);\n        }\n    }\n\n    private int parsePart(String value) {\n        String digits = value.replaceAll("[^0-9].*$", "");\n        return digits.length() == 0 ? 0 : Integer.parseInt(digits);\n    }\n\n    private void showUpdateNotification(String version, String title, String notes, String apkUrl) {\n        Context context = getApplicationContext();\n        NotificationManager manager =\n                (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);\n        if (manager == null) return;\n\n        if (Build.VERSION.SDK_INT >= 26) {\n            NotificationChannel channel = new NotificationChannel(\n                    CHANNEL_ID, "تحديثات تطبيق آية", NotificationManager.IMPORTANCE_HIGH);\n            channel.setDescription("إشعارات توفر إصدارات جديدة من تطبيق آية");\n            manager.createNotificationChannel(channel);\n        }\n\n        Intent intent = new Intent(context, UpdateInstallActivity.class);\n        intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);\n        intent.putExtra("apk_url", apkUrl);\n        intent.putExtra("version", version);\n\n        PendingIntent pendingIntent = PendingIntent.getActivity(\n                context, NOTIFICATION_ID, intent,\n                PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);\n\n        String verLabel = (version == null ? "" : version.trim());\n        String body = "يتوفر إصدار جديد (" + verLabel + ")";\n        if (notes != null && notes.trim().length() > 0) {\n            body = body + " - " + notes.trim();\n        }\n        body = body + " - تحديث الآن";\n\n        // النص الظاهر مطوياً يجب أن يحتوي «تحديث الآن» لأن بعض الأجهزة تخفي الأزرار\n        String collapsed = "تحديث الآن - إصدار " + verLabel;\n\n        NotificationCompat.Builder builder = new NotificationCompat.Builder(context, CHANNEL_ID)\n                .setSmallIcon(R.drawable.ic_stat_aya)\n                .setContentTitle("آية")\n                .setContentText(collapsed)\n                .setStyle(new NotificationCompat.BigTextStyle()\n                        .bigText(body)\n                        .setBigContentTitle("آية")\n                        .setSummaryText("تحديث الآن"))\n                .setContentIntent(pendingIntent)\n                .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)\n                .setAutoCancel(true)\n                .setOnlyAlertOnce(false)\n                .setPriority(NotificationCompat.PRIORITY_HIGH)\n                .setDefaults(NotificationCompat.DEFAULT_ALL)\n                .setColor(0xFF16803B)\n                .setCategory(NotificationCompat.CATEGORY_STATUS);\n\n        try {\n            NotificationCompat.Action act = new NotificationCompat.Action.Builder(\n                    R.drawable.ic_stat_aya,\n                    "تحديث الآن",\n                    pendingIntent\n            ).build();\n            builder.addAction(act);\n        } catch (Exception ignoredAct) {\n            builder.addAction(0, "تحديث الآن", pendingIntent);\n        }\n\n        try {\n            Bitmap largeIcon = BitmapFactory.decodeResource(\n                    context.getResources(), R.mipmap.ic_launcher);\n            if (largeIcon != null) {\n                builder.setLargeIcon(largeIcon);\n            }\n        } catch (Exception ignored) {}\n\n        manager.notify(NOTIFICATION_ID, builder.build());\n    }\n}\n'
          worker.write_text(WORKER_CODE, encoding="utf-8")

          install_activity = java_dir / "UpdateInstallActivity.java"
