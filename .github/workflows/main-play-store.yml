name: Build Aya Android — Google Play (separate)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create Android project
        run: |
          mkdir -p android-app
          cd android-app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare web files
        run: |
          mkdir -p android-app/www
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='android-app' \
            ./ android-app/www/

      - name: Initialize Capacitor
        working-directory: android-app
        run: npx cap init "آية" "com.aya.alquran" --web-dir www

      - name: Add Android platform
        working-directory: android-app
        run: npx cap add android

      - name: Configure Android app name
        working-directory: android-app
        run: |
          python3 << 'PY'
          from pathlib import Path

          p = Path("android/app/src/main/res/values/strings.xml")

          if p.exists():
              text = p.read_text(encoding="utf-8")

              text = text.replace(
                  "app_name\">App",
                  "app_name\">آية"
              )

              p.write_text(text, encoding="utf-8")

          print("Android app name configured.")
          PY

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow

      - name: Sync Capacitor
        working-directory: android-app
        run: npx cap sync android

      - name: Install Aya app icon
        run: |
          python3 << 'PY'
          from pathlib import Path
          from PIL import Image
          import shutil

          icon_path = Path("icon.png")

          if not icon_path.exists():
              raise SystemExit("ERROR: icon.png was not found.")

          original = Image.open(icon_path).convert("RGBA")

          base = Path(
              "android-app/android/app/src/main/res"
          )

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():
              target_dir = base / folder
              target_dir.mkdir(parents=True, exist_ok=True)

              resized = original.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              resized.save(
                  target_dir / "ic_launcher.png",
                  "PNG"
              )

              resized.save(
                  target_dir / "ic_launcher_round.png",
                  "PNG"
              )

              for f in target_dir.glob("ic_launcher*"):
                  if f.name not in [
                      "ic_launcher.png",
                      "ic_launcher_round.png"
                  ]:
                      f.unlink(missing_ok=True)

          fg_size = 432

          canvas = Image.new(
              "RGBA",
              (fg_size, fg_size),
              (0, 0, 0, 0)
          )

          icon_size = int(fg_size * 0.72)

          icon_resized = original.resize(
              (icon_size, icon_size),
              Image.Resampling.LANCZOS
          )

          offset = (
              (fg_size - icon_size) // 2
          )

          canvas.paste(
              icon_resized,
              (offset, offset),
              icon_resized
          )

          xxx = base / "mipmap-xxxhdpi"

          xxx.mkdir(
              parents=True,
              exist_ok=True
          )

          canvas.save(
              xxx / "ic_launcher_foreground.png",
              "PNG"
          )

          bg = Image.new(
              "RGBA",
              (fg_size, fg_size),
              (13, 27, 42, 255)
          )

          bg.save(
              xxx / "ic_launcher_background.png",
              "PNG"
          )

          anydpi = base / "mipmap-anydpi-v26"

          if anydpi.exists():
              shutil.rmtree(anydpi)

          anydpi.mkdir(
              parents=True,
              exist_ok=True
          )

          xml = (
              '<?xml version="1.0" encoding="utf-8"?>'
              '<adaptive-icon '
              'xmlns:android='
              '"http://schemas.android.com/apk/res/android">'
              '<background '
              'android:drawable='
              '"@mipmap/ic_launcher_background"/>'
              '<foreground '
              'android:drawable='
              '"@mipmap/ic_launcher_foreground"/>'
              '</adaptive-icon>'
          )

          (
              anydpi / "ic_launcher.xml"
          ).write_text(
              xml,
              encoding="utf-8"
          )

          (
              anydpi / "ic_launcher_round.xml"
          ).write_text(
              xml,
              encoding="utf-8"
          )

          # أيقونة الإشعار (شريط الحالة) — بنفس أسلوب أيقونة التطبيق
          # مصدرها نفس icon.png في المشروع، وتُولَّد لكل كثافة بشكل نظامي
          # يجب أن تكون بيضاء/شفافة (silhouette) لتعمل على كل الأجهزة
          try:
              src0 = original.convert("RGBA")
              w, h = src0.size
              side = min(w, h)
              left = (w - side) // 2
              top = (h - side) // 2
              src0 = src0.crop((left, top, left + side, top + side))

              def to_white_silhouette(img):
                  img = img.copy()
                  pixels = img.load()
                  ww, hh = img.size
                  for yy in range(hh):
                      for xx in range(ww):
                          r, g, b, a = pixels[xx, yy]
                          if a < 40:
                              pixels[xx, yy] = (0, 0, 0, 0)
                          else:
                              pixels[xx, yy] = (255, 255, 255, a)
                  return img

              # أحجام قياسية لأيقونات الإشعار (status bar)
              notif_sizes = {
                  "drawable-mdpi": 24,
                  "drawable-hdpi": 36,
                  "drawable-xhdpi": 48,
                  "drawable-xxhdpi": 72,
                  "drawable-xxxhdpi": 96,
              }
              for folder, size in notif_sizes.items():
                  ddir = base / folder
                  ddir.mkdir(parents=True, exist_ok=True)
                  resized = src0.resize((size, size), Image.Resampling.LANCZOS)
                  white = to_white_silhouette(resized)
                  out = ddir / "ic_stat_aya.png"
                  white.save(out, "PNG")
                  print("Notification icon:", out, size)

              # نسخة افتراضية في drawable/ للتوافق
              ddef = base / "drawable"
              ddef.mkdir(parents=True, exist_ok=True)
              fallback = src0.resize((48, 48), Image.Resampling.LANCZOS)
              to_white_silhouette(fallback).save(ddef / "ic_stat_aya.png", "PNG")
              print("Notification icon default: drawable/ic_stat_aya.png")
          except Exception as e:
              print("WARN: could not generate ic_stat_aya:", e)

          print("Aya icon improved successfully.")
          PY

      - name: Set automatic Google Play version
        id: ver
        run: |
          CODE="$((203 + GITHUB_RUN_NUMBER))"
          NAME="1.0.${CODE}"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME" >> "$GITHUB_OUTPUT"

      # ============================================================
      # KEYSTORE
      # ============================================================

      - name: Decode and verify keystore
        env:
          K1: ${{ secrets.KS1 }}
          K2: ${{ secrets.KS2 }}
          K3: ${{ secrets.KS3 }}
          K4: ${{ secrets.KS4 }}
          K5: ${{ secrets.KS5 }}
          K6: ${{ secrets.KS6 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 << 'PY'
          import os, re, base64, pathlib, subprocess, sys

          parts = []
          for i in range(1, 7):
              v = os.environ.get(f"K{i}") or ""
              print(f"KS{i} length = {len(v)}")
              if not v:
                  print(f"::error::السر KS{i} ناقص")
                  sys.exit(1)
              parts.append(v)

          b64 = "".join(parts)
          # إزالة أي محارف غير Base64 (مسافات، أسطر، إلخ)
          b64 = re.sub(r"[^A-Za-z0-9+/=]", "", b64)
          # إكمال الحشو إن نقص
          pad = (-len(b64)) % 4
          if pad:
              b64 += "=" * pad

          print(f"Total base64 length = {len(b64)}")

          try:
              raw = base64.b64decode(b64, validate=False)
          except Exception as e:
              print(f"::error::فشل فك Base64: {e}")
              sys.exit(1)

          out = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "aya-release.jks"
          out.write_bytes(raw)
          print(f"Keystore bytes = {len(raw)}")
          if len(raw) < 100:
              print("::error::ملف keystore صغير جداً — الأجزاء ناقصة")
              sys.exit(1)

          pw = os.environ.get("KEYSTORE_PASSWORD") or ""
          alias = os.environ.get("KEY_ALIAS") or ""
          r = subprocess.run(
              ["keytool", "-list", "-keystore", str(out), "-storepass", pw, "-alias", alias],
              capture_output=True,
              text=True,
          )
          print(r.stdout)
          if r.returncode != 0:
              print(r.stderr)
              print("::error::keytool فشل — تحقق من KEYSTORE_PASSWORD و KEY_ALIAS")
              sys.exit(1)
          print("Keystore verified successfully.")
          PY

      # ============================================================
      # VERSION
      # ============================================================

      - name: Set version in Gradle
        env:
          VERSION_CODE: ${{ steps.ver.outputs.versionCode }}
          VERSION_NAME: ${{ steps.ver.outputs.versionName }}
        run: |
          python3 << 'PY'
          from pathlib import Path
          import os
          import re

          vc = os.environ["VERSION_CODE"]
          vn = os.environ["VERSION_NAME"]

          gradle = Path(
              "android-app/android/app/build.gradle"
          )

          if not gradle.exists():
              gradle = Path(
                  "android-app/android/app/build.gradle.kts"
              )

          if not gradle.exists():
              raise SystemExit(
                  "ERROR: Gradle file not found."
              )

          text = gradle.read_text(
              encoding="utf-8"
          )

          text = re.sub(
              r"versionCode\s+\d+",
              "versionCode " + vc,
              text
          )

          text = re.sub(
              r'versionName\s+"[^"]*"',
              'versionName "' + vn + '"',
              text
          )

          gradle.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "version set",
              vc,
              vn
          )
          PY

      # ============================================================
      # NOTIFICATIONS — إشعار التلاوة (قائمة التشغيل)
      # ============================================================

      - name: Configure Android media notifications
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re, base64

          android_root = Path("android-app/android/app/src/main")
          manifest = android_root / "AndroidManifest.xml"
          text = manifest.read_text(encoding="utf-8")

          permissions = [
              "android.permission.INTERNET",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.WAKE_LOCK",
          ]
          for permission in permissions:
              if permission not in text:
                  text = re.sub(
                      r"(<manifest[^>]*>)",
                      r'\1\n    <uses-permission android:name="%s" />' % permission,
                      text,
                      count=1,
                  )

          if "android:usesCleartextTraffic" not in text:
              text = text.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )


          manifest.write_text(text, encoding="utf-8")

          # Remove media notification/service when the app task is swiped away.
          text = manifest.read_text(encoding="utf-8")
          if 'android:name=".AyaMediaService"' in text and 'android:stopWithTask="true"' not in text:
              text = re.sub(
                  r'(<service\s+android:name="\.AyaMediaService"[^>]*)(/?>)',
                  r'\1\n        android:stopWithTask="true"\2',
                  text, count=1
              )
              manifest.write_text(text, encoding="utf-8")


          java_dir = android_root / "java/com/aya/alquran"
          java_dir.mkdir(parents=True, exist_ok=True)
          activity = java_dir / "MainActivity.java"

          activity_b64 = ""
          activity.write_bytes(base64.b64decode(activity_b64))

          # ============================================================
          # ============================================================
          # AYA MEDIA SERVICE — keep the existing service intact
          # IMPORTANT: use AndroidX MediaCompat classes from androidx.media:media
          # ============================================================

          service_b64 = ""
          service_file = java_dir / "AyaMediaService.java"
          service_file.write_bytes(base64.b64decode(service_b64))

          if not service_file.exists():
              raise SystemExit("ERROR: AyaMediaService.java was not created.")

          service_text_check = service_file.read_text(encoding="utf-8")
          required_service = [
              "public class AyaMediaService",
              "android.support.v4.media.session.MediaSessionCompat",
              "android.support.v4.media.session.PlaybackStateCompat",
              "EXTRA_POSITION",
              "EXTRA_DURATION",
              "onTaskRemoved(Intent rootIntent)",
          ]
          missing_service = [x for x in required_service if x not in service_text_check]
          if missing_service:
              raise SystemExit(
                  "ERROR: AyaMediaService.java missing: " + ", ".join(missing_service)
              )

          mtxt = manifest.read_text(encoding="utf-8")
          if 'android:name=".AyaMediaService"' not in mtxt:
              svc = (
                  '    <service\n'
                  '        android:name=".AyaMediaService"\n'
                  '        android:exported="false"\n'
                  '        android:stopWithTask="true"\n'
                  '        android:foregroundServiceType="mediaPlayback" />\n'
              )
              mtxt = re.sub(r"(</application>)", svc + r"\1", mtxt, count=1)
          elif 'android:name=".AyaMediaService"' in mtxt and 'android:foregroundServiceType="mediaPlayback"' not in mtxt:
              mtxt = re.sub(
                  r'(<service\s+android:name="\.AyaMediaService"[^>]*)(/?>)',
                  r'\1\n        android:foregroundServiceType="mediaPlayback"\2',
                  mtxt,
                  count=1
              )
          manifest.write_text(mtxt, encoding="utf-8")
          print("AyaMediaService.java restored and verified without overwriting it later.")


      - name: Remove invalid Activity onTaskRemoved override
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          activity = Path("android-app/android/app/src/main/java/com/aya/alquran/MainActivity.java")
          text = activity.read_text(encoding="utf-8")

          # onTaskRemoved() belongs to Service, not Activity/BridgeActivity.
          # Remove any previously injected override from MainActivity.
          text = re.sub(
              r"\n\s*@Override\s*\n\s*public void onTaskRemoved\(Intent rootIntent\)\s*\{.*?\n\s*\}\s*\n",
              "\n",
              text,
              flags=re.DOTALL,
          )
          text = text.replace("\n        super.onTaskRemoved(rootIntent);", "")
          activity.write_text(text, encoding="utf-8")

          if "onTaskRemoved(" in text or "super.onTaskRemoved(" in text:
              raise SystemExit("ERROR: invalid onTaskRemoved override remains in MainActivity.java")

          print("MainActivity.java fixed: no onTaskRemoved override.")
          PY

      # ============================================================
      # FIX: إخفاء إشعار التلاوة عند الإيقاف (لا يبقى معلّقاً)
      # ============================================================

      - name: Fix media notification dismiss behavior
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          # ----- MainActivity: لا تُعد الإشعار بعد حذفه يدوياً حتى التشغيل -----
          p = Path("android-app/android/app/src/main/java/com/aya/alquran/MainActivity.java")
          if not p.exists():
              raise SystemExit("MainActivity.java not found")
          text = p.read_text(encoding="utf-8")

          if "mediaNotifDismissedByUser" not in text:
              text = text.replace(
                  "private boolean mediaServiceActive = false;",
                  "private boolean mediaServiceActive = false;\n    private boolean mediaNotifDismissedByUser = false;",
                  1,
              )

          if "markMediaNotifDismissed" not in text:
              text = text.replace(
                  "private void hideMediaNotification() {",
                  "public void markMediaNotifDismissed() {\n        mediaNotifDismissedByUser = true;\n        mediaServiceActive = false;\n        isPlaying = false;\n    }\n\n    private void hideMediaNotification() {",
                  1,
              )

          old = (
              'if ("media-play".equals(cmd)) showMediaNotification(t, a, true);\n'
              '                    else if ("media-pause".equals(cmd)) showMediaNotification(t, a, false);\n'
              '                    else if ("media-update".equals(cmd)) showMediaNotification(t, a, p);\n'
              '                    else if ("media-stop".equals(cmd) || "media-hide".equals(cmd)) hideMediaNotification();'
          )
          new = (
              'if ("media-play".equals(cmd)) {\n'
              '                        mediaNotifDismissedByUser = false;\n'
              '                        showMediaNotification(t, a, true);\n'
              '                    } else if ("media-pause".equals(cmd)) {\n'
              '                        if (!mediaNotifDismissedByUser) showMediaNotification(t, a, false);\n'
              '                    } else if ("media-update".equals(cmd)) {\n'
              '                        boolean clear = data != null && data.optBoolean("clear", false);\n'
              '                        if (clear) hideMediaNotification();\n'
              '                        else if (!mediaNotifDismissedByUser) showMediaNotification(t, a, p);\n'
              '                    } else if ("media-stop".equals(cmd) || "media-hide".equals(cmd) || "media-clear".equals(cmd)) {\n'
              '                        hideMediaNotification();\n'
              '                    } else if ("media-dismissed".equals(cmd)) {\n'
              '                        mediaNotifDismissedByUser = true;\n'
              '                        mediaServiceActive = false;\n'
              '                    }'
          )
          # also handle already-patched hide-on-pause variant
          old_hide = (
              'if ("media-play".equals(cmd)) {\n'
              '                        showMediaNotification(t, a, true);\n'
              '                    } else if ("media-pause".equals(cmd)\n'
              '                            || "media-stop".equals(cmd)\n'
              '                            || "media-hide".equals(cmd)\n'
              '                            || "media-clear".equals(cmd)) {\n'
              '                        hideMediaNotification();\n'
              '                    } else if ("media-update".equals(cmd)) {\n'
              '                        boolean clear = data != null && data.optBoolean("clear", false);\n'
              '                        if (clear || !p) hideMediaNotification();\n'
              '                        else showMediaNotification(t, a, true);\n'
              '                    }'
          )
          if old in text:
              text = text.replace(old, new, 1)
              print("OK: MainActivity original block patched")
          elif old_hide in text:
              text = text.replace(old_hide, new, 1)
              print("OK: MainActivity hide-on-pause block replaced")
          elif "mediaNotifDismissedByUser = false" in text and 'if (!mediaNotifDismissedByUser) showMediaNotification' in text:
              print("OK: MainActivity already has dismiss logic")
          else:
              print("WARN: MainActivity media block not matched")

          p.write_text(text, encoding="utf-8")

          # ----- AyaMediaService: DeleteIntent عند سحب الإشعار -----
          sp = Path("android-app/android/app/src/main/java/com/aya/alquran/AyaMediaService.java")
          if sp.exists():
              st = sp.read_text(encoding="utf-8")
              if "ACTION_NOTIF_DISMISSED" not in st:
                  # add action constant near other ACTION_
                  st2 = st
                  if "ACTION_SYNC" in st2 and "ACTION_NOTIF_DISMISSED" not in st2:
                      st2 = st2.replace(
                          "public static final String ACTION_SYNC",
                          'public static final String ACTION_NOTIF_DISMISSED = "com.aya.alquran.ACTION_MEDIA_NOTIF_DISMISSED";\n    public static final String ACTION_SYNC',
                          1,
                      )
                  # handle action in onStartCommand - look for ACTION_SYNC handling
                  if "ACTION_NOTIF_DISMISSED" in st2 and "markMediaNotifDismissed" not in st2:
                      hook = (
                          "        if (ACTION_NOTIF_DISMISSED.equals(intent != null ? intent.getAction() : null)) {\n"
                          "            try {\n"
                          "                MainActivity act = MainActivity.getInstance();\n"
                          "                if (act != null) act.markMediaNotifDismissed();\n"
                          "            } catch (Exception ignored) {}\n"
                          "            stopForeground(true);\n"
                          "            stopSelf();\n"
                          "            return START_NOT_STICKY;\n"
                          "        }\n"
                      )
                      # insert at start of onStartCommand body after super or after first brace content
                      m = re.search(r"public int onStartCommand\(Intent intent, int flags, int startId\)\s*\{", st2)
                      if m:
                          pos = m.end()
                          st2 = st2[:pos] + "\n" + hook + st2[pos:]
                  # setDeleteIntent on builder
                  if "setDeleteIntent" not in st2:
                      needle = ".setOngoing(playing)"
                      if needle in st2:
                          di = (
                              ".setDeleteIntent(PendingIntent.getService(this, 77,\n"
                              "                        new Intent(this, AyaMediaService.class).setAction(ACTION_NOTIF_DISMISSED),\n"
                              "                        PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE))\n"
                              "                .setOngoing(playing)"
                          )
                          st2 = st2.replace(needle, di, 1)
                  if "PendingIntent" not in st2.split("import ")[0] and "import android.app.PendingIntent" not in st2:
                      st2 = st2.replace("import android.app.Notification;", "import android.app.Notification;\nimport android.app.PendingIntent;", 1)
                  sp.write_text(st2, encoding="utf-8")
                  print("OK: AyaMediaService DeleteIntent added")
              else:
                  print("OK: AyaMediaService already has dismiss action")
          else:
              print("WARN: AyaMediaService.java not found")
          PY

      # ============================================================
      # BACKGROUND UPDATE NOTIFICATIONS — فحص التحديثات في الخلفية
      # ============================================================

      - name: Add required AndroidX Media library
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          import re

          gradle = Path("android-app/android/app/build.gradle")
          is_kts = False
          if not gradle.exists():
              gradle = Path("android-app/android/app/build.gradle.kts")
              is_kts = True

          if not gradle.exists():
              raise SystemExit("ERROR: app Gradle file not found.")

          text = gradle.read_text(encoding="utf-8")

          additions = []
          if "androidx.media:media" not in text:
              additions.append('    implementation("androidx.media:media:1.7.0")' if is_kts else '    implementation "androidx.media:media:1.7.0"')

          if additions:
              if "dependencies {" not in text:
                  raise SystemExit("ERROR: dependencies block not found in app Gradle file.")
              text = text.replace("dependencies {", "dependencies {\n" + "\n".join(additions), 1)
              gradle.write_text(text, encoding="utf-8")

          final = gradle.read_text(encoding="utf-8")
          if "androidx.media:media:1.7.0" not in final:
              raise SystemExit("ERROR: androidx.media:media:1.7.0 was not added to app Gradle.")
          print("AndroidX Media 1.7.0 dependency is present.")
          PY

          echo "Checking AndroidX Media on the release compile classpath..."
          cd android-app/android
          ./gradlew :app:dependencies --configuration releaseCompileClasspath --no-daemon > /tmp/aya-deps.txt
          grep -q "androidx.media:media:1.7.0" /tmp/aya-deps.txt || {
            echo "::error::androidx.media:media:1.7.0 is not on releaseCompileClasspath"
            exit 1
          }
          echo "AndroidX Media dependency verified on releaseCompileClasspath."
          cd ../..


      - name: Verify Android media service and private audio storage
        run: |
          set -e
          python3 <<'PY_CLEANUP'
          from pathlib import Path
          import re
          root = Path("android-app/android/app/src/main")
          java_dir = root / "java/com/aya/alquran"
          for name in ("UpdateCheckWorker.java", "UpdateInstallActivity.java", "UpdateDownloadReceiver.java"):
              p = java_dir / name
              if p.exists(): p.unlink()
          manifest = root / "AndroidManifest.xml"
          mt = manifest.read_text(encoding="utf-8")
          mt = re.sub(r'\s*<uses-permission\b(?=[^>]*android:name="android\.permission\.REQUEST_INSTALL_PACKAGES")[^>]*/>\s*', "\n", mt)
          for component in ("UpdateInstallActivity", "UpdateDownloadReceiver"):
              pattern = r'\s*<(?:activity|receiver)\b(?=[^>]*android:name="\.' + component + r'")[^>]*(?:/>|>.*?</(?:activity|receiver)>)\s*'
              mt = re.sub(pattern, "\n", mt, flags=re.DOTALL)
          mt = re.sub(r'\s*<provider\b(?=[^>]*android:name="androidx\.core\.content\.FileProvider")[^>]*>.*?</provider>\s*', "\n", mt, flags=re.DOTALL)
          manifest.write_text(mt, encoding="utf-8")
          file_paths = root / "res/xml/file_paths.xml"
          if file_paths.exists() and "fileprovider" not in mt.lower(): file_paths.unlink()
          PY_CLEANUP
          test -f android-app/android/app/src/main/java/com/aya/alquran/MainActivity.java
          test -f android-app/android/app/src/main/java/com/aya/alquran/AyaMediaService.java
          grep -q "public class AyaMediaService" android-app/android/app/src/main/java/com/aya/alquran/AyaMediaService.java
          grep -q "AyaPrivateAudioStoreJs" android-app/android/app/src/main/java/com/aya/alquran/MainActivity.java
          grep -q 'android:name=".AyaMediaService"' android-app/android/app/src/main/AndroidManifest.xml
          if grep -Rqs --include='AndroidManifest.xml' 'android.permission.REQUEST_INSTALL_PACKAGES' android-app/android/app/src/main; then
            echo "::error::APK installation permission remains"
            exit 1
          fi
          echo "Media service and private audio storage verified."

      # ============================================================
      # إزالة إذن الميكروفون من المانيفست فقط (بدون حظر صارم للكود)
      # ============================================================

      - name: Remove RECORD_AUDIO from manifest if present
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          import re

          root = Path("android-app/android/app/src/main")
          removed = 0
          for manifest in root.rglob("AndroidManifest.xml"):
              text = manifest.read_text(encoding="utf-8")
              new_text = re.sub(
                  r'\s*<uses-permission\s+android:name=["\']android\.permission\.RECORD_AUDIO["\']\s*/?>',
                  "",
                  text,
              )
              if new_text != text:
                  manifest.write_text(new_text, encoding="utf-8")
                  removed += 1
                  print("Removed RECORD_AUDIO from", manifest)
          if removed == 0:
              print("No RECORD_AUDIO permission in manifests (nothing to remove).")
          else:
              print("Stripped RECORD_AUDIO from", removed, "manifest file(s).")
          # لا نفشل البناء بسبب WebChromeClient أو كود عام — التطبيق لا يطلب الميكروفون
          print("Microphone permission will not appear; no hard code ban applied.")
          PY

      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Ensure Manage Space in manifest (before APK build)
        run: |
          python3 -c "import base64; exec(base64.b64decode('').decode('utf-8'))"
          echo "---- Manifest manageSpace check ----"
          grep -n "manageSpaceActivity\|ManageSpaceActivity" android-app/android/app/src/main/AndroidManifest.xml || (echo "MISSING manageSpace" && exit 1)

      - name: Inject app version into web interface
        env:
          VERSION_NAME: ${{ steps.ver.outputs.versionName }}
        run: |
          set -e
          python3 <<'PY_VERSION'
          from pathlib import Path
          import os
          version = os.environ["VERSION_NAME"]
          for rel in (
              "android-app/www/index.html",
              "android-app/android/app/src/main/assets/public/index.html",
          ):
              path = Path(rel)
              if not path.exists():
                  if rel.endswith("assets/public/index.html"):
                      continue
                  raise SystemExit(f"ERROR: {rel} not found")
              html = path.read_text(encoding="utf-8")
              if "__AYA_BUILD_VERSION__" not in html:
                  raise SystemExit(f"ERROR: version placeholder missing in {rel}")
              path.write_text(html.replace("__AYA_BUILD_VERSION__", version), encoding="utf-8")
          packaged = Path("android-app/android/app/src/main/assets/public/index.html")
          source = Path("android-app/www/index.html")
          packaged.parent.mkdir(parents=True, exist_ok=True)
          packaged.write_text(source.read_text(encoding="utf-8"), encoding="utf-8")
          print("Injected version", version, "into menu and About displays.")
          PY_VERSION
          if grep -q "update.json\|download-apk\|updatesOverlay" android-app/android/app/src/main/assets/public/index.html; then
            echo "::error::In-app updater residue remains in packaged web assets"
            exit 1
          fi
          echo "Verified: packaged assets have no in-app updater."

      - name: Build signed release APK
        working-directory: android-app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          chmod +x gradlew

          STORE="${{ github.workspace }}/aya-release.jks"

          if [ ! -f "$STORE" ]; then
            echo "::error::Keystore file not found."
            exit 1
          fi

          # بناء APK (تثبيت مباشر) + AAB (Google Play) معاً
          ./gradlew assembleRelease bundleRelease --stacktrace \
            -Pandroid.injected.signing.store.file="$STORE" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi

          AAB=$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name "*.aab" | head -n 1)
          if [ -z "$AAB" ]; then
            echo "::error::Release AAB was not produced."
            exit 1
          fi

          echo "APK: $APK"
          echo "AAB: $AAB"

          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt -o -name aapt2 | head -n 1)
          if [ -z "$AAPT" ]; then
            echo "::error::aapt/aapt2 not found; cannot verify final APK permissions."
            exit 1
          fi

          if "$AAPT" dump permissions "$APK" | grep -q "android.permission.RECORD_AUDIO"; then
            echo "::warning::APK still lists RECORD_AUDIO (may come from a dependency). App does not request mic at runtime."
          else
            echo "Final APK permission check: RECORD_AUDIO is not declared."
          fi
          echo "Both APK and AAB built successfully."

      # ============================================================
      # UPLOAD APK + AAB
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aya-play-store-apk-${{ steps.ver.outputs.versionName }}
          path: android-app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: aya-play-store-aab-${{ steps.ver.outputs.versionName }}
          path: android-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
