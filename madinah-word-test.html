<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار تلوين كلمة — مصحف المدينة</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9e7df;color:#202820;font-family:system-ui,"Noto Naskh Arabic",sans-serif}
header{padding:14px;background:#176b3a;color:#fff;text-align:center}
h1{margin:0;font-size:19px}
main{max-width:760px;margin:auto;padding:12px}
.tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px}
button{border:1px solid #176b3a;background:#fff;color:#176b3a;border-radius:9px;padding:10px 14px;font-size:15px}
button:disabled{opacity:.45}
#status{text-align:center;line-height:1.8;font-size:13px;margin:10px}
#page{background:#fff;max-width:520px;margin:auto;padding:8px;box-shadow:0 2px 12px #0002}
#page svg{display:block;width:100%;height:auto}
#page .word.test-word path{fill:#d32f2f!important}
.note{max-width:520px;margin:12px auto;text-align:center;font-size:12px;color:#555;line-height:1.8}
</style>
</head>
<body>
<header><h1>اختبار تلوين الكلمات والحركات</h1></header>
<main>
<div class="tools">
<button id="color" disabled>تلوين كلمة تجريبية</button>
<button id="restore" disabled>إعادة اللون الأصلي</button>
</div>
<div id="status">جارٍ تحميل صفحة المصحف وفهرس الكلمات…</div>
<div id="page"></div>
<p class="note">اختبار مستقل للصفحة الأولى فقط. لا يغيّر التطبيق أو ملفات التلاوة. الكلمة التجريبية: 1:1:3. التلوين مؤقت ويُزال بزر إعادة اللون الأصلي.</p>
</main>
<script>
const BASE="https://cdn.quran.ws/svg/elements/v1.1.1/";
const WORD_KEY="1:1:3";
const status=document.getElementById("status");
const pageHost=document.getElementById("page");
const colorButton=document.getElementById("color");
const restoreButton=document.getElementById("restore");
let wordElement=null;
async function loadTest(){
 try{
  const [svgResponse,jsonResponse]=await Promise.all([
   fetch(BASE+"pages/001.svg"),
   fetch(BASE+"index/by-page/001.json")
  ]);
  if(!svgResponse.ok)throw new Error("تعذر تحميل SVG: "+svgResponse.status);
  if(!jsonResponse.ok)throw new Error("تعذر تحميل فهرس الكلمات: "+jsonResponse.status);
  const [svgText,index]=await Promise.all([svgResponse.text(),jsonResponse.json()]);
  const record=index.words.find(w=>w.word_key===WORD_KEY);
  if(!record)throw new Error("الكلمة "+WORD_KEY+" غير موجودة في فهرس الصفحة");
  const parsed=new DOMParser().parseFromString(svgText,"image/svg+xml");
  if(parsed.querySelector("parsererror"))throw new Error("ملف SVG غير صالح");
  const svg=parsed.documentElement;
  wordElement=svg.querySelector('g.word[data-word-key="'+WORD_KEY+'"]');
  if(!wordElement)throw new Error("لم نجد عنصر الكلمة داخل SVG");
  pageHost.replaceChildren(document.importNode(svg,true));
  wordElement=pageHost.querySelector('g.word[data-word-key="'+WORD_KEY+'"]');
  if(!wordElement)throw new Error("تعذر ربط عنصر الكلمة بالصفحة المعروضة");
  const text=record.rasm_uthmani||record.rasm_imlai||"";
  status.textContent="نجح التحميل: الصفحة 1، وعدد الكلمات في الفهرس "+index.count+". الكلمة المحددة: "+text+" ("+WORD_KEY+").";
  colorButton.disabled=false;
  restoreButton.disabled=false;
 }catch(error){
  status.textContent="لم يكتمل الاختبار: "+error.message;
 }
}
colorButton.addEventListener("click",()=>{
 if(!wordElement)return;
 wordElement.classList.add("test-word");
 status.textContent="تم تلوين الكلمة وعلاماتها التابعة لها. اضغط «إعادة اللون الأصلي» للتحقق من الاستعادة.";
});
restoreButton.addEventListener("click",()=>{
 if(!wordElement)return;
 wordElement.classList.remove("test-word");
 status.textContent="أُزيل لون الاختبار وعاد عرض الكلمة إلى ألوان SVG الأصلية.";
});
loadTest();
</script>
</body>
</html>
