<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار تتابع تلوين الكلمات — مصحف المدينة</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9e7df;color:#202820;font-family:system-ui,"Noto Naskh Arabic",sans-serif}
header{padding:14px;background:#176b3a;color:#fff;text-align:center}
h1{margin:0;font-size:19px}
main{max-width:760px;margin:auto;padding:12px}
.tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px}
button{border:1px solid #176b3a;background:#fff;color:#176b3a;border-radius:9px;padding:10px 14px;font-size:15px}
button:disabled{opacity:.45}
#status{text-align:center;line-height:1.9;font-size:13px;margin:10px}
#page{background:#fff;max-width:520px;margin:auto;padding:8px;box-shadow:0 2px 12px #0002}
#page svg{display:block;width:100%;height:auto}
#page .word.test-word path{fill:#d32f2f!important}
.note{max-width:520px;margin:12px auto;text-align:center;font-size:12px;color:#555;line-height:1.8}
</style>
</head>
<body>
<header><h1>اختبار تتابع تلوين الكلمات</h1></header>
<main>
<div class="tools">
<button id="next" disabled>تلوين الكلمة التالية</button>
<button id="reset" disabled>إعادة اللون الأصلي</button>
</div>
<div id="status">جارٍ تحميل صفحة المصحف وفهرس الكلمات…</div>
<div id="page"></div>
<p class="note">اختبار مستقل للصفحة الأولى. ينتقل التلوين كلمةً بعد كلمة في البسملة، مع إزالة لون الكلمة السابقة. لا يغيّر التطبيق أو ملفات التلاوة.</p>
</main>
<script>
const BASE="https://cdn.quran.ws/svg/elements/v1.1.1/";
const WORD_KEYS=["1:1:1","1:1:2","1:1:3","1:1:4"];
const status=document.getElementById("status");
const pageHost=document.getElementById("page");
const nextButton=document.getElementById("next");
const resetButton=document.getElementById("reset");
let words=[];
let current=-1;
async function loadTest(){
 try{
  const [svgResponse,jsonResponse]=await Promise.all([
   fetch(BASE+"pages/001.svg"),
   fetch(BASE+"index/by-page/001.json")
  ]);
  if(!svgResponse.ok)throw new Error("تعذر تحميل SVG: "+svgResponse.status);
  if(!jsonResponse.ok)throw new Error("تعذر تحميل فهرس الكلمات: "+jsonResponse.status);
  const [svgText,index]=await Promise.all([svgResponse.text(),jsonResponse.json()]);
  const parsed=new DOMParser().parseFromString(svgText,"image/svg+xml");
  if(parsed.querySelector("parsererror"))throw new Error("ملف SVG غير صالح");
  pageHost.replaceChildren(document.importNode(parsed.documentElement,true));
  words=WORD_KEYS.map(key=>{
   const record=index.words.find(w=>w.word_key===key);
   const element=pageHost.querySelector('g.word[data-word-key="'+key+'"]');
   if(!record||!element)throw new Error("لم يتم العثور على الكلمة "+key+" في الفهرس والصفحة");
   return {key,record,element};
  });
  status.textContent="نجح التحميل. تم العثور على الكلمات الأربع بالترتيب. اضغط «تلوين الكلمة التالية».";
  nextButton.disabled=false;
  resetButton.disabled=false;
 }catch(error){
  status.textContent="لم يكتمل الاختبار: "+error.message;
 }
}
nextButton.addEventListener("click",()=>{
 if(!words.length)return;
 if(current>=0)words[current].element.classList.remove("test-word");
 current=(current+1)%words.length;
 words[current].element.classList.add("test-word");
 const item=words[current];
 const word=item.record.rasm_uthmani||item.record.rasm_imlai||item.key;
 status.textContent="الكلمة "+(current+1)+" من "+words.length+": "+word+" ("+item.key+").";
});
resetButton.addEventListener("click",()=>{
 words.forEach(item=>item.element.classList.remove("test-word"));
 current=-1;
 status.textContent="تمت إعادة جميع الكلمات إلى ألوانها الأصلية.";
});
loadTest();
</script>
</body>
</html>
